[package]
name = "esdiag-gui"
version.workspace = true
description = "Web server and desktop wrapper of esdiag; an implementation crate without a supported public API"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
include = ["src/**", "templates/**", "build.rs", "README.md", "bundled/**"]

[features]
setup = ["esdiag-core/setup"]
keystore = ["esdiag-core/keystore"]
elasticrc = ["esdiag-core/elasticrc"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener"]

[dependencies]
esdiag-core = { workspace = true, features = ["server"] }
askama = { version = "0.15.6", default-features = false, features = ["derive", "std", "serde_json"] }
async-stream = "0.3.6"
axum.workspace = true
axum-server = "0.8.0"
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
datastar = { version = "0.3.1", features = ["axum"] }
eyre.workspace = true
futures.workspace = true
pulldown-cmark = "0.13.4"
redact.workspace = true
regex.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid.workspace = true
yaml_serde.workspace = true

[dev-dependencies]
esdiag-core = { workspace = true, features = ["server", "test-support"] }
parking_lot.workspace = true
tokio = { workspace = true, features = ["fs", "test-util"] }
