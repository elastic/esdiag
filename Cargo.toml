[package]
name = "esdiag"
version.workspace = true
description = "Elastic Stack diagnostic collector and processor"
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/elastic/esdiag/tree/main/docs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = [
    "src/**",
    "build.rs",
    "about.hbs",
    "tauri.conf.json",
    "desktop/**",
    "LICENSE.txt",
    "NOTICES.md",
    "readme.md",
]

[workspace]
members = [".", "crates/elasticrc", "crates/esdiag-core", "crates/esdiag-gui", "crates/repo-tools"]
default-members = [".", "crates/esdiag-core"]
resolver = "3"

[workspace.package]
version = "0.18.0-SNAPSHOT"
edition = "2024"
rust-version = "1.89"
license = "Elastic-2.0"
repository = "https://github.com/elastic/esdiag"
homepage = "https://github.com/elastic/esdiag"

[workspace.dependencies]
esdiag-core = { path = "crates/esdiag-core", version = "=0.18.0-SNAPSHOT" }
esdiag-gui = { path = "crates/esdiag-gui", version = "=0.18.0-SNAPSHOT" }
axum = { version = "0.8.9", features = ["multipart", "macros"] }
bytes = "1.12.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive"] }
elasticsearch = "9.1.0-alpha.1"
eyre = "0.6.14"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
futures = "0.3"
kibana-sync = "0.4.1"
parking_lot = "0.12"
redact = { version = "0.1.11", features = ["serde"] }
regex = "1.13"
reqwest = { version = "0.12.28", features = ["json", "blocking", "multipart", "stream"] }
rmcp = { version = "3.11.0", default-features = false }
rpassword = "7.5.4"
rust-embed = { version = "8.13.0", features = ["compression", "include-exclude", "interpolate-folder-path"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value"] }
tauri = { version = "2.11.6", features = [] }
tauri-plugin-opener = "2"
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = { version = "2.5.8", features = ["serde"] }
urlencoding = "2.1.3"
uuid = { version = "1.28", features = ["v4", "fast-rng"] }
yaml_serde = "0.10.7"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["full"]
full = ["agent", "server", "setup", "keystore", "elasticrc", "mcp"]
agent = ["esdiag-core/agent"]
mcp = ["esdiag-core/mcp", "dep:rmcp"]
setup = ["esdiag-core/setup", "esdiag-gui?/setup"]
server = ["dep:esdiag-gui", "esdiag-core/server"]
keystore = ["esdiag-core/keystore", "esdiag-gui?/keystore"]
desktop = ["server", "esdiag-gui/desktop", "dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build"]
elasticrc = ["esdiag-core/elasticrc", "esdiag-gui?/elasticrc"]

[dependencies]
esdiag-core.workspace = true
esdiag-gui = { workspace = true, optional = true }
chrono.workspace = true
clap.workspace = true
clap_complete = "4.6"
elasticsearch.workspace = true
eyre.workspace = true
kibana-sync.workspace = true
mimalloc = "0.1.52"
redact.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, optional = true, features = ["transport-io"] }
rpassword.workspace = true
semver.workspace = true
serde_json.workspace = true
tauri = { workspace = true, optional = true }
# tauri-build reads plugin permissions only from direct dependencies.
tauri-plugin-opener = { workspace = true, optional = true }
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "tracing-log"] }
url.workspace = true
uuid.workspace = true
yaml_serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
axum.workspace = true
bytes.workspace = true
flate2.workspace = true
futures.workspace = true
parking_lot.workspace = true
portpicker = "0.1.1"
regex.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["fs", "test-util"] }
zip.workspace = true

[profile.dev]
debug = "line-tables-only"

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["codegen"], optional = true }
