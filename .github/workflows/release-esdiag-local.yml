name: Release esdiag-local

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  lite:
    uses: ./.github/workflows/esdiag-lite.yml

  standalone:
    needs: lite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # Set this on a release branch when the previous release tag is not
          # an ancestor of the tagged commit.
          RELEASE_NOTES_START_TAG: "0.16.5"
        run: |
          previous_tag="$RELEASE_NOTES_START_TAG"
          if [ -z "$previous_tag" ]; then
            previous_tag="$(git tag --merged HEAD --sort=-v:refname | sed -n '2p')"
          fi
          if [ -z "$previous_tag" ]; then
            echo "::error::Unable to determine the release-notes baseline. Set RELEASE_NOTES_START_TAG on the release branch."
            exit 1
          fi
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --draft --verify-tag --generate-notes \
              --notes-start-tag "$previous_tag"
          test "$(gh release view "${{ github.ref_name }}" --json isDraft --jq .isDraft)" = true
      - name: Verify published image manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test -n "$version" && case "$version" in *SNAPSHOT*) exit 1;; esac
          mkdir -p target/release-assets
          docker buildx imagetools inspect "docker.elastic.co/esdiag/esdiag:$version" \
            | tee target/release-assets/image-manifest.txt
          grep -q 'linux/amd64' target/release-assets/image-manifest.txt
          grep -q 'linux/arm64' target/release-assets/image-manifest.txt
      - name: Render release script
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir -p target/release-assets
          sed "s/readonly ESDIAG_VERSION=\"[^\"]*\"/readonly ESDIAG_VERSION=\"$version\"/" \
            bin/esdiag-local > target/release-assets/esdiag-local
          chmod 755 target/release-assets/esdiag-local
          bash -n target/release-assets/esdiag-local
          test "$(target/release-assets/esdiag-local version)" = "$version"
      - name: Stage lite collection scripts
        run: |
          install -m 755 bin/esdiag-lite.sh target/release-assets/esdiag-lite.sh
          install -m 644 bin/esdiag-lite.ps1 target/release-assets/esdiag-lite.ps1
          bash -n target/release-assets/esdiag-lite.sh
      - name: Validate and checksum
        run: |
          shellcheck target/release-assets/esdiag-local target/release-assets/esdiag-lite.sh
          cd target/release-assets
          for asset in esdiag-local esdiag-lite.sh esdiag-lite.ps1; do
            sha256sum "$asset" > "$asset.sha256"
          done
      - name: Attach and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(esdiag-local esdiag-lite.sh esdiag-lite.ps1)
          files=()
          patterns=()
          for asset in "${assets[@]}"; do
            files+=("target/release-assets/$asset" "target/release-assets/$asset.sha256")
            patterns+=(--pattern "$asset" --pattern "$asset.sha256")
          done
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
          mkdir target/release-assets/verification
          gh release download "${{ github.ref_name }}" --dir target/release-assets/verification "${patterns[@]}"
          cd target/release-assets/verification
          for asset in "${assets[@]}"; do
            sha256sum --check "$asset.sha256"
          done
      - name: Leave release draft for human approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "${{ github.ref_name }}" --json isDraft --jq .isDraft)" = true
          echo "Release ${{ github.ref_name }} is verified and remains a draft pending human approval." \
            >> "$GITHUB_STEP_SUMMARY"
